<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Weather Dashboard</title>

<style>
:root{
  --bg-gradient:linear-gradient(135deg,#e0f2fe 0%,#f1f5f9 100%);
  --surface:rgba(255,255,255,.8);
  --surface-card:#fff;
  --border:rgba(15,23,42,.08);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#0284c7;
  --radius-md:12px;
  --radius-lg:20px;
  --shadow:0 10px 25px -5px rgba(15,23,42,.05),0 8px 10px -6px rgba(15,23,42,.05);
}

[data-theme="night"]{
  --bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  --surface:rgba(30,41,59,.7);
  --surface-card:#1e293b;
  --border:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#38bdf8;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg-gradient);
  color:var(--text);
  min-height:100vh;
  padding:3rem 1rem;
  transition:background .5s ease;
}

.app{max-width:540px;margin:auto}

.header{margin-bottom:2rem}
.header h1{font-size:26px}
.header p{font-size:13px;color:var(--muted)}

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:1.5rem;
}

.search-row input{
  flex:1;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--surface-card);
  color:var(--text);
}

.btn{
  border:none;
  cursor:pointer;
  border-radius:var(--radius-md);
  padding:0 18px;
  font-weight:600;
}

.btn-primary{
  background:var(--text);
  color:white;
}

.btn-primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-geo{
  background:var(--surface-card);
  border:1px solid var(--border);
  color:var(--text);
}

.error{
  display:none;
  margin-bottom:1rem;
  padding:12px;
  background:#fee2e2;
  color:#b91c1c;
  border-radius:var(--radius-md);
}

.main-card,.forecast-card{
  background:var(--surface);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.5rem;
  box-shadow:var(--shadow);
}

.main-card{margin-bottom:1rem}

.city-name{font-size:28px;font-weight:700}
.country{font-size:13px;color:var(--muted);margin-bottom:1rem}

.temp-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.temp-big{
  font-size:72px;
  font-weight:800;
}

.weather-icon{font-size:64px}

.feels,.desc{margin-top:.5rem}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:1rem;
}

.stat-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:12px;
  text-align:center;
}

.stat-lbl{
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.stat-val{font-weight:700}

.forecast-title{
  margin-bottom:1rem;
  font-size:13px;
  color:var(--muted);
  text-transform:uppercase;
}

.forecast-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
}

.placeholder,.loading{
  text-align:center;
  padding:4rem 2rem;
  background:var(--surface);
  border-radius:var(--radius-lg);
}

@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .temp-big{font-size:56px}
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Weather App</h1>
    <p>Σύγχρονη πρόγνωση καιρού σε πραγματικό χρόνο</p>
  </div>

  <div class="search-row">
    <button class="btn btn-geo" onclick="getLiveLocation()">📍</button>
    <input id="inp-city" type="text" placeholder="Athens, London...">
    <button id="searchBtn" class="btn btn-primary" onclick="searchCity()">Αναζήτηση</button>
  </div>

  <div id="error-msg" class="error"></div>

  <div id="content">
    <div class="placeholder">
      <h3>Καλώς ήρθατε</h3>
      <p>Φόρτωση τοποθεσίας...</p>
    </div>
  </div>
</div>

<script>
const API_KEY = "4171f0661697affe6ba55371ce641b81";

const ICONS={
'01d':'☀️','01n':'🌙','02d':'⛅','02n':'☁️',
'03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️',
'09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️',
'11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️',
'50d':'🌫️','50n':'🌫️'
};

const DAYS=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

function cleanHTML(str){
 const div=document.createElement("div");
 div.textContent=str||"";
 return div.innerHTML;
}

function showError(msg){
 const el=document.getElementById("error-msg");
 el.innerHTML=cleanHTML(msg);
 el.style.display="block";
}

function hideError(){
 document.getElementById("error-msg").style.display="none";
}

function setLoading(msg){
 document.getElementById("content").innerHTML=`<div class="loading">${msg}</div>`;
}

function initDynamicTheme(){
 const h=new Date().getHours();
 document.documentElement.toggleAttribute("data-theme",h<6||h>19);
 if(h<6||h>19){
   document.documentElement.setAttribute("data-theme","night");
 }
}

setInterval(initDynamicTheme,60000);

document.getElementById("inp-city").addEventListener("keydown",e=>{
 if(e.key==="Enter") searchCity();
});

async function searchCity(){
 const city=document.getElementById("inp-city").value.trim();
 if(!city) return;

 const btn=document.getElementById("searchBtn");
 btn.disabled=true;

 hideError();
 setLoading("Αναζήτηση δεδομένων...");

 try{
   await fetchWeather(
    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=el`,
    `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=el`
   );
 }finally{
   btn.disabled=false;
 }
}

function getLiveLocation(){
 hideError();
 setLoading("Εντοπισμός τοποθεσίας...");

 navigator.geolocation.getCurrentPosition(
 async pos=>{
   const {latitude,longitude}=pos.coords;

   await fetchWeather(
    `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric&lang=el`,
    `https://api.openweathermap.org/data/2.5/forecast?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric&lang=el`
   );
 },
 ()=>{
   showError("Δεν ήταν δυνατή η πρόσβαση στην τοποθεσία.");
   renderPlaceholder();
 },
 {enableHighAccuracy:true,timeout:10000,maximumAge:0}
 );
}

async function fetchWeather(weatherUrl,forecastUrl){
 try{
   const [rw,rf]=await Promise.all([fetch(weatherUrl),fetch(forecastUrl)]);

   if(!rw.ok||!rf.ok){
     throw new Error("API error");
   }

   const weather=await rw.json();
   const forecast=await rf.json();

   renderWeather(weather,forecast);
 }catch(err){
   console.error(err);
   showError("Αποτυχία λήψης δεδομένων.");
   renderPlaceholder();
 }
}

function renderPlaceholder(){
 document.getElementById("content").innerHTML=`
 <div class="placeholder">
   <h3>Δεν υπάρχουν δεδομένα</h3>
   <p>Δοκιμάστε άλλη πόλη.</p>
 </div>`;
}

function processForecast(list){
 const grouped={};

 list.forEach(item=>{
   const date=new Date(item.dt*1000);
   const key=date.toDateString();

   if(!grouped[key]) grouped[key]=[];
   grouped[key].push(item);
 });

 const today=new Date().toDateString();

 return Object.entries(grouped)
 .filter(([k])=>k!==today)
 .slice(0,5)
 .map(([_,items])=>{
   const midday=items.reduce((a,b)=>{
     const ah=Math.abs(new Date(a.dt*1000).getHours()-12);
     const bh=Math.abs(new Date(b.dt*1000).getHours()-12);
     return ah<bh?a:b;
   });

   return {
     dayIndex:new Date(midday.dt*1000).getDay(),
     icon:midday.weather[0].icon,
     temp_max:Math.max(...items.map(i=>i.main.temp_max)),
     temp_min:Math.min(...items.map(i=>i.main.temp_min))
   };
 });
}

function renderWeather(w,f){
 const forecast=processForecast(f.list);

 document.getElementById("content").innerHTML=`
 <div class="main-card">
   <div class="city-name">${cleanHTML(w.name)}</div>
   <div class="country">${cleanHTML(w.sys.country)}</div>

   <div class="temp-row">
      <div class="temp-big">${Math.round(w.main.temp)}°</div>
      <div class="weather-icon">${ICONS[w.weather[0].icon]||"🌡️"}</div>
   </div>

   <div class="feels">Αίσθηση ${Math.round(w.main.feels_like)}°C</div>
   <div class="desc">${cleanHTML(w.weather[0].description)}</div>
 </div>

 <div class="stats-grid">
   <div class="stat-box"><div class="stat-lbl">Υγρασία</div><div class="stat-val">${w.main.humidity}%</div></div>
   <div class="stat-box"><div class="stat-lbl">Άνεμος</div><div class="stat-val">${Math.round(w.wind.speed*3.6)} km/h</div></div>
   <div class="stat-box"><div class="stat-lbl">Πίεση</div><div class="stat-val">${w.main.pressure} hPa</div></div>
   <div class="stat-box"><div class="stat-lbl">Ορατότητα</div><div class="stat-val">${Math.round((w.visibility||0)/1000)} km</div></div>
 </div>

 <div class="forecast-card">
   <div class="forecast-title">Πρόγνωση 5 Ημερών</div>
   ${forecast.map(d=>`
   <div class="forecast-item">
      <div>${DAYS[d.dayIndex]}</div>
      <div>${ICONS[d.icon]||"🌡️"}</div>
      <div>${Math.round(d.temp_max)}° / ${Math.round(d.temp_min)}°</div>
   </div>`).join("")}
 </div>`;
}

window.addEventListener("load",()=>{
 initDynamicTheme();
 getLiveLocation();
});
</script>
</body>
</html>
