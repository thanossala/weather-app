<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <style>
    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface2: #f0efed;
      --border: rgba(0,0,0,0.1);
      --border-hover: rgba(0,0,0,0.25);
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app { max-width: 520px; margin: 0 auto; }

    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 22px; font-weight: 500; }
    .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .search-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
    .search-row input {
      flex: 1;
      padding: 10px 14px;
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-row input:focus { border-color: var(--text); }
    .search-btn {
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 0 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .search-btn:hover { opacity: 0.85; }

    .error {
      font-size: 13px;
      color: #A32D2D;
      margin-bottom: 1rem;
      padding: 10px 14px;
      background: #FCEBEB;
      border-radius: var(--radius-md);
      display: none;
    }

    .main-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .city-name { font-size: 24px; font-weight: 500; }
    .country { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }
    .temp-row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
    .temp-big { font-size: 60px; font-weight: 500; line-height: 1; }
    .temp-unit { font-size: 22px; color: var(--muted); margin-bottom: 10px; }
    .weather-icon { font-size: 52px; line-height: 1; margin-bottom: 0; }
    .feels { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .desc { font-size: 15px; text-transform: capitalize; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 8px;
      margin-bottom: 1rem;
    }
    .stat-box {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .stat-val { font-size: 16px; font-weight: 500; }

    .forecast-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }
    .forecast-title { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 6px;
    }
    .forecast-item {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      text-align: center;
    }
    .fc-day { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .fc-icon { font-size: 22px; margin-bottom: 4px; }
    .fc-temp { font-size: 14px; font-weight: 500; }
    .fc-min { font-size: 11px; color: var(--muted); }

    .placeholder {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .placeholder .icon { font-size: 40px; margin-bottom: 12px; }
    .placeholder p { margin-top: 6px; font-size: 12px; }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .forecast-grid { grid-template-columns: repeat(5, minmax(0,1fr)); }
      .temp-big { font-size: 48px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Weather App</h1>
    <p>Πραγματικός καιρός από το OpenWeatherMap API</p>
  </div>

  <div class="search-row">
    <input type="text" id="inp-city" placeholder="Αναζήτησε πόλη (π.χ. Athens, London)..." />
    <button class="search-btn" onclick="search()">Αναζήτηση</button>
  </div>

  <div class="error" id="error-msg"></div>

  <div id="content">
    <div class="placeholder">
      <div class="icon">⛅</div>
      <div>Αναζήτησε μια πόλη για να δεις τον καιρό</div>
      <p>Δεδομένα σε πραγματικό χρόνο από το OpenWeatherMap</p>
    </div>
  </div>
</div>

<script>
  
  const API_KEY = '4171f0661697affe6ba55371ce641b81';

  const ICONS = {
    '01d':'☀️','01n':'🌙','02d':'⛅','02n':'☁️',
    '03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️',
    '09d':'🌧️','09n':'🌧️','10d':'🌦️','10n':'🌧️',
    '11d':'⛈️','11n':'⛈️','13d':'❄️','13n':'❄️',
    '50d':'🌫️','50n':'🌫️'
  };

  const DAYS = ['Κυρ','Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ'];

  document.getElementById('inp-city').addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  // async function = function που χρησιμοποιεί await
  async function search() {
    const city = document.getElementById('inp-city').value.trim();
    if (!city) return;
    hideError();

    document.getElementById('content').innerHTML = '<div class="loading">Φορτώνω...</div>';

    try {
      // fetch() = στέλνουμε αίτημα στο API
      // await = περιμένουμε την απάντηση πριν συνεχίσουμε
      const weatherRes = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=el`
      );

      if (!weatherRes.ok) {
        showError('Η πόλη δεν βρέθηκε. Δοκίμασε στα αγγλικά (π.χ. Athens, Thessaloniki).');
        document.getElementById('content').innerHTML = '';
        return;
      }

      // .json() = μετατρέπουμε την απάντηση σε JavaScript object
      const w = await weatherRes.json();

      // Δεύτερο αίτημα για 5-ήμερη πρόβλεψη
      const forecastRes = await fetch(
        `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=el`
      );
      const f = await forecastRes.json();

      renderWeather(w, f);

    } catch (err) {
      showError('Σφάλμα σύνδεσης. Έλεγξε ότι το API key είναι σωστό.');
      document.getElementById('content').innerHTML = '';
    }
  }

  function renderWeather(w, f) {
    // Παίρνουμε 1 αποτέλεσμα ανά μέρα (κάθε 8 * 3h = 24h)
    const daily = f.list.filter((_, i) => i % 8 === 0).slice(0, 5);
    const icon = ICONS[w.weather[0].icon] || '🌡️';
    const date = new Date().toLocaleDateString('el-GR', { weekday:'long', day:'numeric', month:'long' });

    document.getElementById('content').innerHTML = `
      <div class="main-card">
        <div class="city-name">${w.name}</div>
        <div class="country">${w.sys.country} · ${date}</div>
        <div class="temp-row">
          <div class="temp-big">${Math.round(w.main.temp)}</div>
          <div class="temp-unit">°C</div>
          <div class="weather-icon">${icon}</div>
        </div>
        <div class="feels">Αίσθηση ${Math.round(w.main.feels_like)}°C</div>
        <div class="desc">${w.weather[0].description}</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-lbl">Υγρασία</div>
          <div class="stat-val">${w.main.humidity}%</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Άνεμος</div>
          <div class="stat-val">${Math.round(w.wind.speed)} m/s</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Πίεση</div>
          <div class="stat-val">${w.main.pressure} hPa</div>
        </div>
        <div class="stat-box">
          <div class="stat-lbl">Ορατότητα</div>
          <div class="stat-val">${w.visibility ? Math.round(w.visibility / 1000) + ' km' : 'N/A'}</div>
        </div>
      </div>

      <div class="forecast-card">
        <div class="forecast-title">5-ήμερη πρόβλεψη</div>
        <div class="forecast-grid">
          ${daily.map(d => `
            <div class="forecast-item">
              <div class="fc-day">${DAYS[new Date(d.dt * 1000).getDay()]}</div>
              <div class="fc-icon">${ICONS[d.weather[0].icon] || '🌡️'}</div>
              <div class="fc-temp">${Math.round(d.main.temp_max)}°</div>
              <div class="fc-min">${Math.round(d.main.temp_min)}°</div>
            </div>`).join('')}
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
